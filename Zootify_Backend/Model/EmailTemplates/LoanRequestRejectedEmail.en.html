<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Loan request rejected</title>
</head>
<body style="margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: #f3f4f6;">
<table style="background-color: #f3f4f6;">
    <tr>
        <td style="padding: 40px 16px;">
            <table style="max-width: 600px; width: 100%; background-color: #ffffff; border-radius: 12px; box-shadow: 0 4px 16px rgba(0,0,0,0.06); overflow: hidden;">
                <tr>
                    <td style="background-color: #dc2626; height: 4px; line-height: 4px; font-size: 0;">&nbsp;</td>
                </tr>
                <tr>
                    <td style="padding: 32px 40px 0;">
                        <span style="font-size: 20px; font-weight: 700; color: #111827; letter-spacing: -0.01em;">Zootify</span>
                    </td>
                </tr>
                <tr>
                    <td style="padding: 32px 40px 0;">
                        <h1 style="margin: 0 0 12px; font-size: 28px; font-weight: 700; color: #111827; line-height: 1.25; letter-spacing: -0.02em;">
                            Hello, {userName}
                        </h1>
                        <p style="margin: 0; font-size: 16px; color: #6b7280; line-height: 1.6;">
                            Unfortunately, your loan request has been rejected.
                        </p>
                    </td>
                </tr>
                <tr>
                    <td style="padding: 24px 40px 0;">
                        <table style="background-color: #fef2f2; border: 1px solid #fecaca; border-radius: 8px; width: 100%;">
                            <tr>
                                <td style="padding: 16px 20px;">
                                    <p style="margin: 0 0 4px; font-size: 13px; color: #dc2626; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em;">Requested animal</p>
                                    <p style="margin: 0 0 8px; font-size: 18px; font-weight: 700; color: #111827;">{specimenName}</p>
                                    <p style="margin: 0; font-size: 14px; font-style: italic; color: #6b7280;">{specimenLatinName}</p>
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>
                <tr>
                    <td style="padding: 20px 40px 0;">
                        <p style="margin: 0 0 8px; font-size: 14px; font-weight: 600; color: #374151;">Reason:</p>
                        <table style="background-color: #f9fafb; border: 1px solid #e5e7eb; border-radius: 8px; width: 100%;">
                            <tr>
                                <td style="padding: 16px 20px;">
                                    <p style="margin: 0; font-size: 15px; color: #374151; line-height: 1.6;">{reason}</p>
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>
                <tr>
                    <td style="padding: 24px 40px;">
                        <table style="width: 100%;">
                            <tr>
                                <td style="border-top: 1px solid #e5e7eb; height: 1px; line-height: 1px; font-size: 0;">&nbsp;</td>
                            </tr>
                        </table>
                    </td>
                </tr>
                <tr>
                    <td style="background-color: #f9fafb; padding: 24px 40px; text-align: center; border-top: 1px solid #e5e7eb;">
                        <p style="margin: 0; font-size: 13px; color: #6b7280; line-height: 1.5;">
                            Contact our
                            <a href="mailto:support@zootify.de" style="color: #16a34a; text-decoration: none; font-weight: 600;">support</a>.
                        </p>
                    </td>
                </tr>
            </table>
            <table style="max-width: 600px; width: 100%; margin-top: 24px;">
                <tr>
                    <td style="text-align: center; padding: 0 20px;">
                        <p style="margin: 0; font-size: 12px; color: #9ca3af; line-height: 1.5;">
                            &copy; 2026 Zootify. All rights reserved.
                        </p>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
